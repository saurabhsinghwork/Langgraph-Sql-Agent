[server]
# [Streamlit Server Configuration]: Automatically reload app when files change on disk
runOnSave = true
headless = true
port = 8501

[theme]
# [Streamlit Theme Configuration]: Custom modern dark theme
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#c9d1d9"
